name: Tests & CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./chatroom
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './chatroom/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Automated Tests (App & DB)
        run: pnpm test
